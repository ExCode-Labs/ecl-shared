name: ci

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: format check
        run: npm run format:check

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build
